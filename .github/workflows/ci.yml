name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:build
      - name: Build with drafts shown (superset of production pages, for checks)
        run: pnpm build
        env:
          PUBLIC_SHOW_DRAFTS: 'true'
      - name: Internal link check
        run: pnpm linkinator ./dist --recurse --skip "^https?://(?!(localhost|127\.0\.0\.1)[:/])"
      - name: Lighthouse budgets
        run: pnpm lhci autorun
      - name: Content staleness report (warnings only)
        run: pnpm staleness
